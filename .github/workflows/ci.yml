name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test
        run: bash gradlew build --warning-mode fail --no-daemon --max-workers=2
      - name: Publish to Maven Local
        run: bash gradlew publishToMavenLocal --warning-mode fail --no-daemon --max-workers=2
      - name: Verify publication metadata
        run: bash gradlew verifyPublication --warning-mode fail --no-daemon --max-workers=2
      - name: Verify Java and Kotlin consumers
        run: bash gradlew -p consumers clean verify --warning-mode fail --no-daemon --max-workers=2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: warn
      - name: Upload library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: taiwan-mahjong-library
          path: build/libs/*.jar
          if-no-files-found: error
